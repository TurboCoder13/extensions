---
name: Renovate validation

"on":
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  config:
    if: github.repository == 'TurboCoder13/extensions'
    runs-on: ubuntu-latest
    outputs:
      extensions: ${{ steps.scope.outputs.extensions }}
    steps:
      # actions/checkout v6
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          sparse-checkout: |
            scripts/ci
      # actions/setup-node v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24"
      - name: Validate Renovate configuration
        run: ./scripts/ci/validate-renovate.sh
      - name: Select maintained extensions
        id: scope
        run: ./scripts/ci/renovate-extension-matrix.sh

  extensions:
    if: github.repository == 'TurboCoder13/extensions'
    needs: config
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        extension: ${{ fromJSON(needs.config.outputs.extensions) }}
    steps:
      # actions/checkout v6
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          sparse-checkout: |
            scripts/ci
            ${{ matrix.extension }}
      # actions/setup-node v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24"
      - name: Build and test maintained extension
        env:
          EXTENSION_DIR: ${{ matrix.extension }}
        run: ./scripts/ci/check-renovate-extension.sh
